name: Release to PyPI

# Publishes `modeltest` to PyPI when a `v*` tag is pushed.
# Requires PyPI Trusted Publishing to be configured for this repo:
#   PyPI -> Account settings -> Publishing -> Add publisher
#   owner: Tzinny-dev, repo: model-test, workflow: release.yml

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build and check distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build twine
      - name: Build sdist + wheel
        run: python -m build
      - name: Validate metadata
        run: twine check dist/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/